name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan changed commits for secrets
        uses: trufflesecurity/trufflehog@0c952ace0f842f11c75775922d7400335cf60bc6
        with:
          version: "3.97.1"
          extra_args: --results=verified,unknown
