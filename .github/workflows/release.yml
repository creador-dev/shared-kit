name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Create release PR or publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up trusted publishing-compatible npm
        run: npm install --global npm@11 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push package version tags
        if: steps.changesets.outputs.published == 'true'
        run: git push origin --tags

      - name: Generate consolidated release notes
        id: release-notes
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/wpxdev-release-notes.md
        run: node .github/scripts/create-consolidated-release.mjs

      - name: Create consolidated GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release-notes.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release-notes.outputs.title }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/wpxdev-release-notes.md
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES_PATH"
